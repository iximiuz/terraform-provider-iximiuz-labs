name: Feature Request
description: Suggest a new feature or enhancement for the iximiuz Labs Terraform provider
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe your use case and the
        solution you'd like to see.

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe the problem or workflow that this feature would address.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: |
        Describe how you'd like this feature to work. Include example Terraform
        configuration if applicable.
      render: hcl
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative approaches?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information or context about the feature request.
    validations:
      required: false
