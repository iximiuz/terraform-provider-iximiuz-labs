name: Bug Report
description: Report a bug with the iximiuz Labs Terraform provider
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as
        possible so we can reproduce and fix the issue.

  - type: input
    id: provider-version
    attributes:
      label: Provider Version
      description: The version of the iximiuz-labs provider you are using.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: terraform-version
    attributes:
      label: Terraform Version
      description: Output of `terraform version`.
      placeholder: "1.10.0"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages or unexpected output.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Provide a minimal Terraform configuration and the commands needed to
        reproduce the issue.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might help (logs, screenshots, environment details).
    validations:
      required: false
